version: '3.8'

services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: mrwiseowl-db
    environment:
      POSTGRES_DB: mrwiseowl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mrwiseowl-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-localdev-only}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-in-prod}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
