    url = 'jdbc:postgresql://db.clamldjsgwixexashtmm.supabase.co:5432/postgres'
    user = 'postgres'
    password = '4JYz_!2hQsCi$uS'
    locations = ['filesystem:src/main/resources/db/migration']
